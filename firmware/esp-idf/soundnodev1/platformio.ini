; PlatformIO Project Configuration – SoundNode v1 (ESP-IDF)
; ESP32 Bluetooth-A2DP MP3-Player. PlatformIO lädt ESP-IDF-Toolchain automatisch.
; Bluetooth Classic (A2DP) → ESP32 (nicht S3/C3).
;
; Build:  pio run   ·   Flash: pio run -t upload   ·   Monitor: pio device monitor -b 115200

[platformio]
; ESP-IDF-Projekt nutzt main/ (statt PlatformIOs src/)
src_dir = main

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.flash_size = 4MB
